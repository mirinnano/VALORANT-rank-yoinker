[package]
name = "vry-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "busters"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
discord-rich-presence = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
vry-core = { version = "0.2.2", path = "../../../crates/core" }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Editing", "Media_MediaProperties", "Media_Transcoding", "Storage", "Storage_Search", "Storage_Streams"] }

name: Release

# v で始まるタグを push すると、署名付きのインストーラーと更新用の latest.json を
# GitHub Releases に公開する。タグの版は tauri.conf.json の version と揃えること。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vry-core --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ("v$($conf.version)" -ne "${{ github.ref_name }}") {
            Write-Error "tauri.conf.json の version ($($conf.version)) がタグ (${{ github.ref_name }}) と違います"
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: busters.gg ${{ github.ref_name }}
          releaseBody: |
            ## インストール
            `busters.gg_*_x64-setup.exe` をダウンロードして実行してください。管理者権限は要りません。
            インストール済みの場合は、アプリが新しい版を知らせます。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

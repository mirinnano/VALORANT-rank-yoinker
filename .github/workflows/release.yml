name: Release

# v で始まるタグを push すると、署名付きのインストーラーと更新用の latest.json を
# GitHub Releases に公開する。タグの版は tauri.conf.json の version と揃えること。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vry-core --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ("v$($conf.version)" -ne "${{ github.ref_name }}") {
            Write-Error "tauri.conf.json の version ($($conf.version)) がタグ (${{ github.ref_name }}) と違います"
          }
      # Release は tauri-action に作らせず、ここで先に作る。tauri-action は
      # target_commitish に push 時の commit を渡すため、その commit がもうブランチの
      # 先頭でないと GITHUB_TOKEN では作成を拒まれる (v0.1.0 で起きた)。
      # target_commitish を付けずに既存のタグから作れば、その条件に当たらないはず。
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG は作成済みです"
          else
            gh release create "$TAG" --verify-tag --title "busters.gg $TAG" --notes-file .github/release-notes.md
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: busters.gg ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

name: Desktop

on:
  push:
    branches: [rewrite]
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "Cargo.*"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

# 同じブランチへ続けて push したら、古い実行を止める。リリース用の実行には付けない。
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p vry-core --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis --config tauri.ci.conf.json
        working-directory: apps/desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: busters-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
